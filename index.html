<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>40k Mission Selector</title>
    <style>
        /* Bestehende Styles unverändert */
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>
    <h1>Warhammer 40k Mission Selector</h1>
    
    <div class="container">
        <button id="selectMission">Mission auswählen</button>
        <button id="resetButton">Zurücksetzen</button>
    </div>
    <!-- Bereich für die Missionsanzeige -->
    <div id="mission" class="mission-details"></div>
    <script>
        let primaryMissionGenerated = false;
        let deploymentZoneGenerated = false;
        let primaryMission = null;
        let deploymentZone = null;
        
        const primaryMissions = [
            { 
                name: 'Secure Objective', 
                description: 'Erhalte Punkte, indem du bestimmte Ziele sicherst. Objective-Marker sind zentral und an den Flanken positioniert. Punkteverteilung: Bis zu 10 Punkte pro Runde für das Halten von Zielen, maximal 50 Punkte insgesamt.' 
            },
            { 
                name: 'Seize Ground', 
                description: 'Kontrolliere so viel Gelände wie möglich. Objective-Marker sind gleichmäßig auf dem Spielfeld verteilt. Punkteverteilung: 5 Punkte für jedes gehaltene Ziel, bis zu 50 Punkte insgesamt.' 
            },
            { 
                name: 'Engage on All Fronts', 
                description: 'Teile deine Kräfte auf und dominiere verschiedene Sektoren. Objective-Marker in den vier Spielfeldecken. Punkteverteilung: 3 Punkte pro Runde für die Präsenz in mindestens drei Sektoren, maximal 15 Punkte pro Runde, bis zu 50 Punkte insgesamt.' 
            },
            { 
                name: 'Dominate the Field', 
                description: 'Erobere das zentrale Schlachtfeld und kontrolliere es. Ein zentraler Objective-Marker sowie je einer in den Startzonen. Punkteverteilung: 10 Punkte pro Runde für das Halten des zentralen Ziels, maximal 50 Punkte insgesamt.' 
            },
            { 
                name: 'Hold the Line', 
                description: 'Verteidige deine Aufstellungszone gegen feindliche Angriffe. Objective-Marker nahe der eigenen Aufstellungszone und in der Mitte des Spielfelds. Punkteverteilung: 5 Punkte pro Runde für das Verteidigen der Aufstellungszone, maximal 50 Punkte insgesamt.' 
            }
        ];
        
        const secondaryMissions = [
            /* Sekundärmissionen unverändert */
        ];

        const gambitMissions = [
            /* Gambit-Missionen unverändert */
        ];

        const deploymentZones = [
            /* Einsatzzonen unverändert */
        ];

        document.getElementById('selectMission').addEventListener('click', function() {
            if (!deploymentZoneGenerated) {
                deploymentZone = deploymentZones[Math.floor(Math.random() * deploymentZones.length)];
                deploymentZoneGenerated = true;
            }
            if (!primaryMissionGenerated) {
                primaryMission = primaryMissions[Math.floor(Math.random() * primaryMissions.length)];
                primaryMissionGenerated = true;
            }
            const randomSecondary = secondaryMissions[Math.floor(Math.random() * secondaryMissions.length)];
            const randomGambit = gambitMissions[Math.floor(Math.random() * gambitMissions.length)];
            document.getElementById('mission').innerHTML = `
                <p><strong>Einsatzzone:</strong> ${deploymentZone.name}</p>
                <p class="description">${deploymentZone.description}</p>
                <p><strong>Primärmission:</strong> ${primaryMission.name}</p>
                <p class="description">${primaryMission.description}</p>
                <p><strong>Sekundärmission:</strong> ${randomSecondary.name}</p>
                <p class="description">${randomSecondary.description}</p>
                <p><strong>Gambit:</strong> ${randomGambit.name}</p>
                <p class="description">${randomGambit.description}</p>
            `;
        });

        document.getElementById('resetButton').addEventListener('click', function() {
            primaryMissionGenerated = false;
            deploymentZoneGenerated = false;
            primaryMission = null;
            deploymentZone = null;
            document.getElementById('mission').innerHTML = '';
        });
    </script>
</body>
</html>
